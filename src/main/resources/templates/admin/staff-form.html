<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Nitec Management - Staff Form</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error": "#ba1a1a",
                        "secondary-container": "#dfe0e0",
                        "tertiary-fixed": "#e0e3e6",
                        "inverse-primary": "#abd600",
                        "on-secondary-fixed-variant": "#454747",
                        "surface-container-low": "#f6f3f2",
                        "tertiary-fixed-dim": "#c4c7ca",
                        "primary-container": "#ccff00",
                        "tertiary": "#5b5f61",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#3c4d00",
                        "on-secondary-fixed": "#1a1c1c",
                        "error-container": "#ffdad6",
                        "primary": "#506600",
                        "secondary": "#5d5f5f",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#dcd9d9",
                        "on-tertiary-fixed-variant": "#44474a",
                        "surface": "#fcf9f8",
                        "primary-fixed": "#c3f400",
                        "surface-tint": "#506600",
                        "on-surface": "#1c1b1b",
                        "outline": "#747a60",
                        "secondary-fixed": "#e2e2e2",
                        "surface-container": "#f0edec",
                        "surface-bright": "#fcf9f8",
                        "surface-variant": "#e5e2e1",
                        "surface-container-high": "#ebe7e7",
                        "surface-container-highest": "#e5e2e1",
                        "on-primary-container": "#5b7300",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed": "#191c1e",
                        "tertiary-container": "#ebedf0",
                        "primary-fixed-dim": "#abd600",
                        "outline-variant": "#c4c9ac",
                        "on-background": "#1c1b1b",
                        "on-tertiary-container": "#686b6e",
                        "on-primary-fixed": "#161e00",
                        "on-secondary-container": "#616363",
                        "secondary-fixed-dim": "#c6c6c7",
                        "on-error": "#ffffff",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#313030",
                        "background": "#fcf9f8",
                        "on-surface-variant": "#444933",
                        "inverse-on-surface": "#f3f0ef"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-margin": "64px",
                        "unit": "4px",
                        "gutter": "24px",
                        "container-padding": "32px",
                        "element-gap": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "display-lg-mobile": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-bold": ["Plus Jakarta Sans"]
                    }
                }
            }
        }
    </script>
<style>
        .neumorphic-inset {
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.05), inset -2px -2px 5px rgba(255,255,255,1);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
        }
        .neumorphic-card {
            background-color: #FFFFFF;
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.05), 0 0 0 1px #FFFFFF;
        }
        .inset-input {
            background: #F3F5F8;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .inset-input:focus {
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02), 0 0 0 2px #ccff00;
            outline: none;
        }
    </style>
</head>
<body class="bg-[#F3F5F8] text-on-background font-body-md min-h-screen flex selection:bg-primary-container selection:text-on-primary-container">

<!-- SideNavBar Component -->
<div th:replace="~{admin/fragments/sidebar :: adminSidebar('staff')}"></div>

<!-- Main Content Wrapper -->
<div class="flex-1 md:pl-72 flex flex-col w-full">
<!-- TopAppBar Component -->
<div th:replace="~{admin/fragments/sidebar :: adminTopbar}"></div>

<!-- Main Canvas Area -->
<main class="flex-1 pt-24 px-5 md:px-gutter pb-section-margin max-w-2xl mx-auto w-full">
    <!-- Page Header -->
    <div class="mb-6">
        <a th:href="@{/admin/staff}" class="text-xs font-bold text-secondary hover:text-[#111111] flex items-center gap-1 mb-2">
            <span class="material-symbols-outlined text-sm">arrow_back</span> Back to Staff Directory
        </a>
        <h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-background font-bold" th:text="${staff.SId != null ? 'Edit Staff Member' : 'New Staff Registration'}">Staff Form</h1>
        <p class="font-body-lg text-body-lg text-secondary mt-1">Configure system credentials and access role privileges.</p>
    </div>

    <div class="neumorphic-card rounded-2xl p-8 shadow-sm">
        <form th:action="@{/admin/staff/save}" th:object="${staff}" method="post" class="space-y-5">
            <input type="hidden" th:field="*{SId}">

            <div>
                <label class="block text-xs font-bold text-secondary uppercase tracking-wider mb-2">Full Name</label>
                <input type="text" th:field="*{fullName}" class="inset-input w-full rounded-xl px-4 py-3 text-sm text-on-surface font-semibold" placeholder="e.g. John Doe" required>
            </div>

            <div>
                <label class="block text-xs font-bold text-secondary uppercase tracking-wider mb-2">Username</label>
                <input type="text" th:field="*{userName}" class="inset-input w-full rounded-xl px-4 py-3 text-sm text-on-surface font-mono" placeholder="e.g. johndoe" required>
            </div>

            <div>
                <label class="block text-xs font-bold text-secondary uppercase tracking-wider mb-2">Password</label>
                <input type="password" th:field="*{password}" class="inset-input w-full rounded-xl px-4 py-3 text-sm text-on-surface" placeholder="Enter secure password" required>
            </div>

            <div>
                <label class="block text-xs font-bold text-secondary uppercase tracking-wider mb-2">Security Role</label>
                <select th:field="*{role}" class="inset-input w-full rounded-xl px-4 py-3 text-sm text-on-surface font-semibold" required>
                    <option value="ADMIN">ADMIN (Full Access to Financial &amp; System Settings)</option>
                    <option value="STOCK">STOCK (Manage Products, Inventory &amp; Categories)</option>
                    <option value="USER">USER (Customer Access to Storefront &amp; Cart)</option>
                </select>
            </div>

            <div class="flex items-center gap-3 pt-4">
                <button type="submit" class="flex-1 bg-[#111111] text-[#CCFF00] font-bold py-3.5 px-6 rounded-full hover:bg-black transition-all shadow-md flex items-center justify-center gap-2 active:scale-95">
                    <span class="material-symbols-outlined text-lg">save</span> Save Staff Member
                </button>
                <a th:href="@{/admin/staff}" class="px-6 py-3.5 rounded-full bg-surface-variant text-secondary font-bold text-sm hover:bg-black/10 transition-colors">Cancel</a>
            </div>
        </form>
    </div>
</main>
</div>

</body>
</html>
